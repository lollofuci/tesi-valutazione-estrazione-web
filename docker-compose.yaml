services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    ports:
      - "8003:8003"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    ports:
      - "8004:8000"
    environment:
      - BACKEND_URL=http://backend:8003
      - ATPTOUR_HEADLESS=true
    depends_on:
      - backend